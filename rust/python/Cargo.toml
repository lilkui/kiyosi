[package]
name = "kiyosi-python"
description = "Python adapters for the Rust pricing core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
kiyosi-core = { path = "../core", version = "0.13.0" }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
