[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "kiyosi"
description = "Rust candidate: European and American pricing, analytics, market curves and calendars"
dynamic = ["version"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt", "THIRD_PARTY_NOTICES.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
test = ["QuantLib==1.43"]

[tool.maturin]
python-source = "python"
module-name = "kiyosi._native"
bindings = "pyo3"
