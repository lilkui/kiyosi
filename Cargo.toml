[workspace]
members = ["rust/core", "rust/python"]
default-members = ["rust/core"]
resolver = "3"

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/lilkui/kiyosi"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
