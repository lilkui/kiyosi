[workspace]
members = ["crates/kiyosi", "crates/kiyosi-python"]
default-members = ["crates/kiyosi"]
resolver = "3"

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/lilkui/kiyosi"
[profile.release]
lto = "thin"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Inferred defaults and ordinary accessors do not need extra type or attribute noise.
default_trait_access = "allow"
must_use_candidate = "allow"
# Keep numerical formulas and their tests together regardless of line count.
too_many_lines = "allow"
# Mathematical symbols and related domain terms intentionally have similar names.
many_single_char_names = "allow"
similar_names = "allow"
