[workspace]
members = ["crates/kiyosi", "crates/kiyosi-python"]
default-members = ["crates/kiyosi"]
resolver = "3"

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
license-file = "LICENSE.txt"
repository = "https://github.com/lilkui/kiyosi"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
