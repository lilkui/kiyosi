name: Publish distributions

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish distributions to PyPI
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/kiyosi/
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify release tag
        run: >-
          python -c "import os, pathlib, tomllib;
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'];
          tag = os.environ['GITHUB_REF_NAME'];
          assert tag == f'v{version}', f'release tag {tag!r} does not match package version {version!r}'"

      - name: Find successful CI for release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$sha" -f branch=main -f event=push -f status=success -F per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run found for release commit $sha"
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download Linux distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions-ubuntu-26.04
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Download Windows distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions-windows-2025-vs2026
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Check complete ordinary-wheel matrix and source distribution
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          distributions = Path('dist')
          for abi in ('cp311', 'cp312', 'cp313', 'cp314', 'cp315'):
              for platform in ('manylinux*_x86_64', 'win_amd64'):
                  pattern = f'kiyosi-{version}-{abi}-{abi}-{platform}.whl'
                  matches = list(distributions.glob(pattern))
                  assert len(matches) == 1, (pattern, matches)
          assert len(list(distributions.glob('*.whl'))) == 10
          assert [path.name for path in distributions.glob('*.tar.gz')] == [f'kiyosi-{version}.tar.gz']
          PY

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
