name: Publish distributions

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish distributions to PyPI
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/kiyosi/
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify release tag
        run: >-
          python -c "import os, pathlib, re; text = pathlib.Path('CMakeLists.txt').read_text();
          version = re.search(r'project\(kiyosi VERSION ([0-9.]+)', text).group(1);
          tag = os.environ['GITHUB_REF_NAME'];
          assert tag == f'v{version}', f'release tag {tag!r} does not match package version {version!r}'"

      - name: Find successful CI for release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$sha" -f branch=main -f event=push -f status=success -F per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run found for release commit $sha"
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download Linux distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions-ubuntu-26.04
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Download Windows distributions
        uses: actions/download-artifact@v8
        with:
          pattern: distributions-windows-2025-vs2026-*
          merge-multiple: true
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Check Windows wheel completeness
        run: >-
          python -c "from pathlib import Path;
          missing = [abi for abi in ('cp311', 'cp312', 'cp313', 'cp314', 'cp315')
          if len(list(Path('dist').glob(f'kiyosi-*-{abi}-{abi}-win_amd64.whl'))) != 1];
          assert not missing, f'expected one Windows wheel per Python version: {missing}'"

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
