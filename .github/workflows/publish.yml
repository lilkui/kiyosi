name: Build and publish distributions

on:
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - pyproject.toml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - examples/**
      - include/**
      - src/**
      - python/**
      - tests/**
      - tools/generate_sse_calendar.py
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test-core:
    name: Test C++ core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test Linux core
        if: runner.os == 'Linux'
        run: cmake --workflow --preset linux-release
      - name: Build and test Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallPath) { throw "Visual Studio C++ tools were not found" }
          & "$vsInstallPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --workflow --preset windows-release

  test-cpu:
    name: Test Python with CUDA disabled
    runs-on: ubuntu-24.04
    env:
      CMAKE_ARGS: -DKIYOSI_ENABLE_CUDA=OFF
      KIYOSI_TEST_CUDA: disabled
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests/python -p 'test_*.py'

  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - name: Verify release tag
        if: github.event_name == 'release'
        run: >-
          python -c "import os, pathlib, re; text = pathlib.Path('CMakeLists.txt').read_text();
          version = re.search(r'project\(kiyosi VERSION ([0-9.]+)', text).group(1);
          tag = os.environ['GITHUB_REF_NAME'];
          assert tag == f'v{version}', f'release tag {tag!r} does not match package version {version!r}'"

      - name: Install CUDA Toolkit
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: '12.9.2'
          method: network
          sub-packages: '["nvcc", "cudart", "cuobjdump", "curand_dev", "visual_studio_integration"]'

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0

      - name: Build source distribution
        if: runner.os == 'Linux'
        run: pipx run build --sdist --outdir wheelhouse

      - name: Check distribution sizes
        run: >-
          python -c "from pathlib import Path; from zipfile import ZipFile;
          oversized = [(path.name, path.stat().st_size) for path in Path('wheelhouse').iterdir()
          if path.stat().st_size >= 100 * 1024 * 1024];
          assert not oversized, f'distributions exceed PyPI size limit: {oversized}';
          bundled = [(wheel.name, member) for wheel in Path('wheelhouse').glob('*.whl')
          for member in ZipFile(wheel).namelist() if 'cudart' in member.lower()];
          assert not bundled, f'wheels contain shared CUDA runtimes instead of static linkage: {bundled}'"

      - uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ matrix.os }}
          path: wheelhouse/*
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    if: github.event_name == 'release'
    needs: [build, test-cpu, test-core]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/kiyosi/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
