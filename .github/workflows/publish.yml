name: Build and publish distributions

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - pyproject.toml
      - CMakeLists.txt
      - CMakePresets.json
      - benchmarks/**
      - cmake/**
      - examples/**
      - include/**
      - src/**
      - python/**
      - tests/**
      - tools/generate_sse_calendar.py
      - tools/quantlib-oracle/**
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'release' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  test-oracle:
    name: Check QuantLib reference generation
    if: github.event_name != 'release'
    # Use Windows to reproduce the committed reference bytes.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv run --frozen --project tools/quantlib-oracle python tools/quantlib-oracle/check_generation.py

  test-core:
    name: Test C++ core on ${{ matrix.os }}
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test Linux core
        if: runner.os == 'Linux'
        run: |
          cmake --preset linux-release -DKIYOSI_BUILD_BENCHMARKS=ON
          cmake --build --preset linux-release
          ctest --preset linux-release
      - name: Build and test Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallPath) { throw "Visual Studio C++ tools were not found" }
          & "$vsInstallPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --workflow --preset windows-release

  test-cpu:
    name: Test Python with CUDA disabled
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    env:
      CMAKE_ARGS: -DKIYOSI_ENABLE_CUDA=OFF
      KIYOSI_TEST_CUDA: disabled
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests/python -p 'test_*.py'

  build:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.wheel }}
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            wheel: ''
          - os: windows-2022
            wheel: cp311-win_amd64
          - os: windows-2022
            wheel: cp312-win_amd64
          - os: windows-2022
            wheel: cp313-win_amd64
          - os: windows-2022
            wheel: cp314-win_amd64

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install CUDA Toolkit
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: '12.9.2'
          method: network
          sub-packages: '["nvcc", "cudart", "cuobjdump", "curand_dev", "visual_studio_integration"]'

      - name: Cache cibuildwheel tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ matrix.os }}-${{ matrix.wheel }}-${{ hashFiles('pyproject.toml', '.github/workflows/publish.yml') }}
          restore-keys: |
            cibw-${{ matrix.os }}-${{ matrix.wheel }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          only: ${{ matrix.wheel }}
        env:
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache

      - name: Build source distribution
        if: runner.os == 'Linux'
        run: pipx run build --sdist --outdir wheelhouse

      - name: Check distribution sizes
        run: >-
          python -c "from pathlib import Path; from zipfile import ZipFile;
          oversized = [(path.name, path.stat().st_size) for path in Path('wheelhouse').iterdir()
          if path.stat().st_size >= 100 * 1024 * 1024];
          assert not oversized, f'distributions exceed PyPI size limit: {oversized}';
          bundled = [(wheel.name, member) for wheel in Path('wheelhouse').glob('*.whl')
          for member in ZipFile(wheel).namelist() if 'cudart' in member.lower()];
          assert not bundled, f'wheels contain shared CUDA runtimes instead of static linkage: {bundled}'"

      - uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ matrix.os }}${{ matrix.wheel && format('-{0}', matrix.wheel) || '' }}
          path: wheelhouse/*
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/kiyosi/
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify release tag
        run: >-
          python -c "import os, pathlib, re; text = pathlib.Path('CMakeLists.txt').read_text();
          version = re.search(r'project\(kiyosi VERSION ([0-9.]+)', text).group(1);
          tag = os.environ['GITHUB_REF_NAME'];
          assert tag == f'v{version}', f'release tag {tag!r} does not match package version {version!r}'"

      - name: Find successful CI for release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs" \
            -f head_sha="$sha" -f branch=main -f event=push -f status=success -F per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run found for release commit $sha"
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download Linux distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions-ubuntu-24.04
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Download Windows distributions
        uses: actions/download-artifact@v8
        with:
          pattern: distributions-windows-2022-*
          merge-multiple: true
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Check Windows wheel completeness
        run: >-
          python -c "from pathlib import Path;
          missing = [abi for abi in ('cp311', 'cp312', 'cp313', 'cp314')
          if len(list(Path('dist').glob(f'kiyosi-*-{abi}-{abi}-win_amd64.whl'))) != 1];
          assert not missing, f'expected one Windows wheel per Python version: {missing}'"

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
