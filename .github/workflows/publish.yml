name: Publish distributions

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish distributions to PyPI
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/kiyosi/
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify release tag
        run: >-
          python -c "import os, pathlib, tomllib;
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'];
          tag = os.environ['GITHUB_REF_NAME'];
          assert tag == f'v{version}', f'release tag {tag!r} does not match package version {version!r}'"

      - name: Find successful CI for release commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$sha" -f branch=main -f event=push -f status=success -F per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful main CI run found for release commit $sha"
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download Linux distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions-ubuntu-26.04
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Download Windows distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions-windows-2025-vs2026
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist

      - uses: astral-sh/setup-uv@v7

      - name: Check configured wheel matrix and source distribution
        run: |
          uv run --no-project --with cibuildwheel -- python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"][
              "version"
          ]
          distributions = Path("dist")
          command = [sys.executable, "-m", "cibuildwheel", "--print-build-identifiers"]
          expected_wheels = set()
          for platform in ("linux", "windows"):
              identifiers = subprocess.check_output(
                  [*command, "--platform", platform], text=True
              ).split()
              assert identifiers, platform
              for identifier in identifiers:
                  abi, platform_tag = identifier.split("-", 1)
                  platform_tag = platform_tag.replace("manylinux_", "manylinux*_")
                  pattern = f"kiyosi-{version}-{abi}-{abi}-{platform_tag}.whl"
                  matches = list(distributions.glob(pattern))
                  assert len(matches) == 1, (pattern, matches)
                  expected_wheels.update(matches)
          assert set(distributions.glob("*.whl")) == expected_wheels
          assert [path.name for path in distributions.glob("*.tar.gz")] == [
              f"kiyosi-{version}.tar.gz"
          ]
          PY

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
