name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - name: Check, test, document and package the core without Python
        env:
          PYO3_PYTHON: /nonexistent/python
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo check --locked
          cargo test --release --locked
          cargo doc --no-deps --locked
          test -L crates/kiyosi/THIRD_PARTY_NOTICES.txt
          cargo package -p kiyosi --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p kiyosi-python --lib --release --locked

  python-style:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-project --with ruff -- ruff check python examples/python tools
      - run: uv run --no-project --with ruff -- ruff format --check python examples/python tools
      - run: uv run --no-project --with ty -- ty check --extra-search-path python/src --error unused-ignore-comment python/src python/tests/typing
      - name: Check benchmark coverage and report handling
        working-directory: benchmarks/quantlib
        run: python3 -m unittest test_coverage test_run.CommandTests test_run.ReportWriteTests test_run.ReportTests

  distributions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.7'
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: stable
      - name: Build the source distribution
        run: uv build --sdist --out-dir dist
      - name: Install locked wheel tooling
        run: |
          uv venv .wheel-tools
          uv pip sync --python .wheel-tools --require-hashes --only-binary :all: .github/cibuildwheel.txt
      - name: Build and test abi3 wheels from the sdist
        run: uv run --no-project --python .wheel-tools -- python -m cibuildwheel dist/*.tar.gz --output-dir dist
      - name: Keep one source distribution from Linux
        if: runner.os == 'Windows'
        run: rm dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
