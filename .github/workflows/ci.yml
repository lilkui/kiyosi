name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  quality:
    name: clang-format, clang-tidy, Ruff format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Python tooling
        run: python -m pip install nanobind==3.1.0 ruff==0.16.9
      - name: Configure quality checks
        run: >-
          cmake --preset quality
          -DCMAKE_CXX_COMPILER=clang++-22
          -DKIYOSI_CLANG_FORMAT_EXECUTABLE=clang-format-22
          -DKIYOSI_CLANG_TIDY_EXECUTABLE=clang-tidy-22
          -DKIYOSI_BUILD_BENCHMARKS=ON
      - name: Run quality checks
        run: cmake --build --preset quality --parallel 2

  test-core:
    name: Test C++ core on ${{ matrix.os }} (static)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test Linux core
        if: runner.os == 'Linux'
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake --preset linux-release -DKIYOSI_BUILD_BENCHMARKS=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build --preset linux-release
          ctest --preset linux-release
          cmake --install out/build/linux-release --prefix "$PWD/out/install/core"
          cmake -S tests/install -B out/build/install-test -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/out/install/core"
          cmake --build out/build/install-test
          env -u LD_LIBRARY_PATH ctest --test-dir out/build/install-test --output-on-failure
      - name: Build and test Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version '[18.0,19.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vsInstallPath) { throw "Visual Studio C++ and clang-cl tools were not found" }
          & "$vsInstallPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --workflow --preset windows-release
          cmake --install out/build/windows-release --prefix "$PWD/out/install/core"
          cmake -S tests/install -B out/build/install-test -G Ninja -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/out/install/core"
          cmake --build out/build/install-test
          $env:PATH = "$PWD/out/install/core/bin;$env:PATH"
          ctest --test-dir out/build/install-test --output-on-failure

  test-cpu:
    name: Test Python with CUDA disabled
    runs-on: ubuntu-26.04
    env:
      CC: gcc-15
      CXX: g++-15
      CMAKE_ARGS: -DKIYOSI_ENABLE_CUDA=OFF
      KIYOSI_TEST_CUDA: disabled
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests/python -p 'test_*.py'

  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install CUDA Toolkit
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        with:
          cuda: '13.2.0'
          method: network
          sub-packages: '["nvcc", "nvvm", "crt", "cudart", "cuobjdump", "curand_dev", "thrust", "visual_studio_integration"]'

      - name: Configure Windows wheel toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version '[18.0,19.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vsInstallPath) { throw "Visual Studio C++ and clang-cl tools were not found" }
          & "$vsInstallPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH') {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }

      - name: Cache cibuildwheel tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ matrix.os }}-${{ hashFiles('pyproject.toml', '.github/workflows/ci.yml') }}
          restore-keys: |
            cibw-${{ matrix.os }}-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache

      - name: Build source distribution
        if: runner.os == 'Linux'
        run: pipx run build --sdist --outdir wheelhouse

      - name: Check distribution sizes
        run: >-
          python -c "from pathlib import Path; from zipfile import ZipFile;
          oversized = [(path.name, path.stat().st_size) for path in Path('wheelhouse').iterdir()
          if path.stat().st_size >= 100 * 1024 * 1024];
          assert not oversized, f'distributions exceed PyPI size limit: {oversized}';
          bundled = [(wheel.name, member) for wheel in Path('wheelhouse').glob('*.whl')
          for member in ZipFile(wheel).namelist() if 'cudart' in member.lower()];
          assert not bundled, f'wheels contain shared CUDA runtimes instead of static linkage: {bundled}';
          missing_tbb = [wheel.name for wheel in Path('wheelhouse').glob('*.whl')
          if not any('tbb' in member.lower() and ('.so' in member or member.endswith('.dll'))
          for member in ZipFile(wheel).namelist())];
          assert not missing_tbb, f'wheels lack the oneTBB runtime: {missing_tbb}'"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: distributions-${{ matrix.os }}
          path: wheelhouse/*
          retention-days: 14
          if-no-files-found: error
