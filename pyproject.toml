[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "kiyosi"
description = "A modern quantitative finance library for pricing vanilla and exotic derivatives"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Jiangping Li" }]
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/lilkui/kiyosi"
Issues = "https://github.com/lilkui/kiyosi/issues"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = "project\\(kiyosi VERSION (?P<value>[0-9.]+)"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/kiyosi"]
cmake.args = [
    "-DKIYOSI_BUILD_PYTHON=ON",
    "-DKIYOSI_INSTALL=OFF",
    "-DKIYOSI_BUILD_EXAMPLES=OFF",
    "-DBUILD_TESTING=OFF",
]
