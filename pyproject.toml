[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "kiyosi"
description = "A Python library for pricing vanilla and exotic derivatives"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Jiangping Li" }]
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/lilkui/kiyosi"
Issues = "https://github.com/lilkui/kiyosi/issues"

[project.optional-dependencies]
test = ["QuantLib==1.43"]

[tool.maturin]
manifest-path = "crates/kiyosi-python/Cargo.toml"
python-source = "python"
module-name = "kiyosi._native"
bindings = "pyo3"
locked = true
include = [
    { path = "tests/python/**/*.py", format = "sdist" },
    { path = "tests/python/quantlib_reference/*.json", format = "sdist" },
    { path = "tests/README.md", format = "sdist" },
    { path = "tools/generate_sse_calendar.py", format = "sdist" },
    { path = "docs/**/*.md", format = "sdist" },
    { path = "README.en.md", format = "sdist" },
]

[tool.cibuildwheel]
build = "cp3{11,12,13,14,15}-*"
skip = "*-musllinux_*"
archs = ["auto64"]
build-frontend = "build[uv]"
test-sources = [
    "Cargo.toml",
    "tests/python",
    "crates/kiyosi-core/src/time/sse_holidays.rs",
    "tools/generate_sse_calendar.py",
]
test-extras = ["test"]
test-command = 'python -m unittest discover -s tests/python -p "test_*.py"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
