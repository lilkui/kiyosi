minimum_pre_commit_version: '4.4.0'
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy --fix
        entry: clang-tidy -p=out/build/quality --fix --quiet
        language: unsupported
        stages: [pre-push]
        files: ^(include|src|tests|examples|python/kiyosi)/.*\.(cpp|hpp)$
        require_serial: true

      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: unsupported
        files: \.(cpp|hpp|cu)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
